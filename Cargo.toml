[package]
name = "brainfuck-rs"
version = "0.5.0"
authors = ["MunHammer <191528445+MunHammer@users.noreply.github.com>"]
edition = "2024"
description = "A brainfuck compiler & interpreter"
readme = "README.md"
repository = "https://github.com/MunHammer/brainfuck-rs/"
license = "GPL-3.0-or-later"
keywords = ["compiler", "interpreter", "CLI", "WIP"]
categories = ["compilers", "command-line-utilities"]
publish = false

[dependencies]
bitcode = { version = "0.5", features = ["derive"] }
clap = { version = "4.5.56", features = ["derive"], optional = true }
console = { version = "0.16.2", optional = true }
directories = { version = "6.0.0", optional = true }
rustyline = { version = "18.0.1", optional = true }

[dev-dependencies]
rstest = "0.26.1"

[features]
default = ["cli"]
interpret = ["dep:console"]
repl = ["interpret", "dep:rustyline", "dep:directories"]
cli = ["dep:clap", "repl", "dep:directories"]

# lints

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = 0 }
large_stack_arrays = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }

[lints.rust]
missing_docs = "warn"
# for code coverage ignoring
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(coverage,coverage_nightly)',
] }
