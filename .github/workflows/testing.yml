name: Test code for errors
on:
  push:
    paths:
      - **.rs
      - **.toml
      - **.lock
  pull_request:
    branches:
      - main
  workflow_call:
jobs:
  test:
    name: Test suite
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run cargo test
        run: cargo test --verbose
    strategy:
      matrix:
        os: [ubuntu-slim, macos-latest, windows-latest]
  lint:
    name: Lints
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run cargo fmt
        run: cargo fmt --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run cargo doc
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
